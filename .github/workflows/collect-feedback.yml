name: Collect feedback

# Run by hand at the end of a feedback period: Actions -> Collect feedback -> Run workflow.
# It gathers every comment and 👍 for the cycle and opens a pull request with the draft
# requirements for the next cycle. Edit that file, then merge to start the next cycle.

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle whose feedback to collect (e.g. 1)"
        required: true

permissions:
  contents: write
  pull-requests: write
  discussions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect comments and sign-offs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_MEMBERS: ${{ secrets.TEAM_MEMBERS }}
        run: python scripts/collect_feedback.py --cycle "${{ inputs.cycle }}"

      - name: Open a pull request with the next requirements
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ inputs.cycle }}
        run: |
          next=$(printf "%02d" $((CYCLE + 1)))
          branch="feedback/cycle-$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add feedback requirements
          git commit -m "Requirements for cycle $next from team feedback on cycle $CYCLE"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Requirements for cycle $next (from team feedback)" \
            --body "Draft generated by scripts/collect_feedback.py. Edit requirements/cycle-$next.md (remove rejected items, resolve conflicts), then merge. The next agent run starts cycle $next."
