name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The data repo is private and not available here: tests marked needs_data are skipped,
      # and the agent graph runs against a stub instead of Claude.
      - run: python -m pytest -q
        env:
          FML_AGENT_FAKE_LLM: "1"
      - run: python -m sitegen build --strict
