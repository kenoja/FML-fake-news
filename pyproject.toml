[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fml"
version = "0.1.0"
description = "Logistic regression vs. an LLM for classifying 9/11 conspiracy articles (LOCO), plus the agent that builds and explains it"
requires-python = ">=3.11"
dependencies = [
  # analysis
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "anthropic>=0.40",
  "pyyaml>=6",
  # agent
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  # site
  "jinja2>=3.1",
  "markdown>=3.6",
  "pygments>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fml = "fml.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fml*", "agent*", "sitegen*"]

[tool.setuptools.package-data]
agent = ["prompts/*.md"]
sitegen = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_data: requires the private data repo (skipped when it is missing)"]
